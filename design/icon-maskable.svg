<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The maskable variant: same mark as icon.svg, but the ground runs to every
    edge so Android can crop it to whatever shape the launcher uses (circle,
    squircle, teardrop) without cutting into a rounded corner of ours.

    The safe zone is the centred circle of 80% diameter — radius 204.8 here.
    The mark's furthest points are its base corners at 182 from centre, so it
    sits inside that with room to spare.
  -->
  <defs>
    <linearGradient id="centre" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#c9befd"/>
      <stop offset="1" stop-color="#8875f5"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8875f5"/>
      <stop offset="1" stop-color="#6c56e8"/>
    </linearGradient>
    <linearGradient id="left" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c56e8"/>
      <stop offset="1" stop-color="#4632ad"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#17171b"/>

  <path d="M256 84 128 214 196 428Z" fill="url(#left)"/>
  <path d="M256 84 196 428 316 428Z" fill="url(#centre)"/>
  <path d="M256 84 316 428 384 214Z" fill="url(#right)"/>
  <path d="M256 84 128 214 256 148Z" fill="#ffffff" opacity="0.18"/>
</svg>
